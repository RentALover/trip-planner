spring:
  datasource:
    url: jdbc:mysql://localhost:3306/trip_planner?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.tripplanner: DEBUG

transport:
  lookup:
    aviationstack-key: ${AVIATIONSTACK_KEY:}

tripplanner:
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${ALIOSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET}
    bucket-name: trip-planner
